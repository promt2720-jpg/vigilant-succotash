<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LUCKY CASINO</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0f0f1a;color:#fff;font-family:Arial;text-align:center}
  header{padding:16px;background:linear-gradient(90deg,#f59e0b,#ef4444,#8b5cf6)}
  h1{margin:0;font-size:24px}
  #bal{font-size:26px;font-weight:bold;margin:6px;color:#fff}
  #jack{font-size:14px;background:#000;padding:6px 12px;border-radius:20px;display:inline-block}
  .tabs{display:flex;gap:8px;justify-content:center;margin:12px}
  .tab{padding:11px 18px;border:none;border-radius:20px;background:#222;color:#fff;font-size:15px}
  .tab.active{background:#f59e0b;color:#000;font-weight:bold}
  .card{background:#1e1e2e;border:2px solid #333;border-radius:20px;padding:16px;margin:12px auto;max-width:360px}
  .reels{display:flex;justify-content:center;gap:10px;background:#000;padding:14px;border-radius:14px;margin:12px 0;font-size:50px}
  .reel{background:#fff;width:82px;height:82px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .bets{display:flex;justify-content:center;gap:8px;margin:10px}
  .bet{padding:9px 15px;background:#222;border:2px solid #444;color:#fff;border-radius:10px}
  .bet.sel{background:#22c55e;color:#000;border-color:#22c55e;font-weight:bold}
  .spin{width:100%;padding:15px;background:#f59e0b;border:none;border-radius:14px;font-size:18px;font-weight:bold}
  .spin:active{transform:scale(.97)}
  #msg{margin:10px;font-weight:bold;color:#fbbf24;min-height:22px}
  .wheel{width:170px;height:170px;border-radius:50%;background:conic-gradient(#e11d48 0 30deg,#111 30deg 60deg,#e11d48 60deg 90deg,#111 90deg 120deg,#e11d48 120deg 150deg,#111 150deg 180deg,#e11d48 180deg 210deg,#111 210deg 240deg,#e11d48 240deg 270deg,#111 270deg 300deg,#e11d48 300deg 330deg,#111 330deg 360deg);margin:15px auto;border:5px solid gold;transition:transform 2s cubic-bezier(.1,.7,.3,1);position:relative}
  .wheel:after{content:'★';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#000;width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
  .cbtn{padding:12px 16px;border:none;border-radius:12px;font-weight:bold}
  .page{display:none}
  .page.active{display:block}
  #log{font-size:12px;color:#888;padding:10px;max-height:100px;overflow:auto}
</style>
</head>
<body>
<header>
  <h1>🎰 LUCKY CASINO 🎰</h1>
  <div id="bal">💰 1000</div>
  <div id="jack">🏆 ДЖЕКПОТ: <span id="jackNum">10000</span></div>
</header>
<div class="tabs">
  <button class="tab active" onclick="tab('slots',this)">🎰 СЛОТЫ</button>
  <button class="tab" onclick="tab('roulette',this)">🎡 РУЛЕТКА</button>
  <button class="tab" onclick="tab('dice',this)">🎲 КУБИКИ</button>
</div>

<div id="slots" class="page active">
  <div class="card">
    <div>Ставка: <b id="betTxt">50</b></div>
    <div class="bets">
      <button class="bet" onclick="setBet(10,this)">10</button>
      <button class="bet sel" onclick="setBet(50,this)">50</button>
      <button class="bet" onclick="setBet(100,this)">100</button>
      <button class="bet" onclick="setBet(500,this)">500</button>
    </div>
    <div class="reels"><div class="reel" id="r1">🍒</div><div class="reel" id="r2">🍒</div><div class="reel" id="r3">🍒</div></div>
    <button class="spin" onclick="spin()">🎰 КРУТИТЬ</button>
    <div id="msg">Удачи!</div>
    <div style="font-size:12px;color:#aaa;line-height:1.8">💎💎💎 = ДЖЕКПОТ<br>7️⃣7️⃣7️⃣ = x10 | 🍒🍒🍒 = x5<br>⭐⭐⭐ = x4 | Пара = x2</div>
  </div>
</div>

<div id="roulette" class="page">
  <div class="card">
    <div class="wheel" id="wheel"></div>
    <div class="bets">
      <button class="cbtn" style="background:#e11d48;color:#fff" onclick="pick('red',this)">🔴 КРАСНОЕ x2</button>
      <button class="cbtn" style="background:#000;color:#fff;border:1px solid #fff" onclick="pick('black',this)">⚫ ЧЁРНОЕ x2</button>
      <button class="cbtn" style="background:#16a34a;color:#fff" onclick="pick('green',this)">🟢 x14</button>
    </div>
    <div class="bets"><button class="bet sel" onclick="setBet(50,this)">50</button><button class="bet" onclick="setBet(100,this)">100</button><button class="bet" onclick="setBet(500,this)">500</button></div>
    <button class="spin" onclick="spinR()">🎡 КРУТИТЬ РУЛЕТКУ</button>
    <div id="msg2">Выбери цвет</div>
  </div>
</div>

<div id="dice" class="page">
  <div class="card">
    <div style="font-size:90px" id="dice">🎲</div>
    <div>Больше или меньше 7?</div>
    <div class="bets"><button class="bet sel" onclick="setBet(50,this)">50</button><button class="bet" onclick="setBet(100,this)">100</button><button class="bet" onclick="setBet(200,this)">200</button></div>
    <div class="bets">
      <button class="cbtn" style="background:#16a34a" onclick="dice('low')">⬇ МЕНЬШЕ 7 x2</button>
      <button class="cbtn" style="background:#e11d48" onclick="dice('high')">⬆ БОЛЬШЕ 7 x2</button>
    </div>
    <div id="msg3">Кидай!</div>
  </div>
</div>

<div id="log"></div>
<button onclick="resetGame()" style="background:#222;color:#fff;border:1px solid #555;padding:9px 16px;border-radius:10px;margin-bottom:20px">🔄 Сброс</button>

<script>
let bal=1000, bet=50, jack=10000, col='red';
let sym=['💎','7️⃣','🍒','⭐','🍋','🔔','🍇'];
function tab(id,el){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById(id).classList.add('active'); el.classList.add('active'); }
function setBet(v,el){ bet=v; document.getElementById('betTxt').innerText=v; document.querySelectorAll('.bet').forEach(b=>b.classList.remove('sel')); el.classList.add('sel'); }
function upd(){ document.getElementById('bal').innerText='💰 '+bal; document.getElementById('jackNum').innerText=jack; if(bal<=0){ alert('Банкрот! +1000'); bal=1000; upd(); } }
function log(t){ document.getElementById('log').innerHTML=t+'<br>'+document.getElementById('log').innerHTML; }
function spin(){
  if(bal<bet) return alert('Нет монет');
  bal-=bet; jack+=Math.floor(bet*0.3); upd();
  let m=document.getElementById('msg'); m.innerText='Крутим...';
  let iv=setInterval(()=>{ r1.innerText=sym[Math.random()*sym.length|0]; r2.innerText=sym[Math.random()*sym.length|0]; r3.innerText=sym[Math.random()*sym.length|0]; },80);
  setTimeout(()=>{ clearInterval(iv);
    let a=sym[Math.random()*sym.length|0], b=sym[Math.random()*sym.length|0], c=sym[Math.random()*sym.length|0];
    r1.innerText=a; r2.innerText=b; r3.innerText=c;
    let win=0;
    if(a==b&&b==c){ if(a=='💎'){ win=jack; m.innerText='💥 ДЖЕКПОТ +'+win; jack=10000; } else if(a=='7️⃣') win=bet*10; else if(a=='🍒') win=bet*5; else win=bet*4; m.innerText='🎉 '+a+b+c+' +'+win; }
    else if(a==b||b==c||a==c){ win=bet*2; m.innerText='✅ Пара +'+win; } else m.innerText='😢 Мимо';
    bal+=win; if(win>0&&navigator.vibrate) navigator.vibrate(80); upd(); log('🎰 '+a+b+c+' '+(win>0?'+'+win:'-'+bet));
  },900);
}
function pick(c,el){ col=c; document.querySelectorAll('.cbtn').forEach(b=>b.style.opacity=.5); el.style.opacity=1; }
function spinR(){
  if(bal<bet) return alert('Нет монет');
  bal-=bet; upd();
  wheel.style.transform='rotate('+(Math.random()*360+1080)+'deg)';
  setTimeout(()=>{ let r=Math.random(); let res=r<.45?'red':r<.9?'black':'green'; let em=res=='red'?'🔴':res=='black'?'⚫':'🟢'; let win=0;
    if(res==col){ win=res=='green'?bet*14:bet*2; msg2.innerText='🎉 '+em+' ВЫИГРЫШ +'+win; } else msg2.innerText='😢 '+em+' мимо';
    bal+=win; upd(); log('🎡 '+em+' '+(win>0?'+'+win:'-'+bet));
  },2100);
}
function dice(ch){
  if(bal<bet) return alert('Нет монет');
  bal-=bet; upd();
  let d1=Math.random()*6+1|0, d2=Math.random()*6+1|0, s=d1+d2;
  diceEl.innerText=['','⚀','⚁','⚂','⚃','⚄','⚅'][d1];
  let diceEl=document.getElementById('dice');
  setTimeout(()=>{ let win=0; let w=(ch=='high'&&s>7)||(ch=='low'&&s<7);
    if(s==7){ msg3.innerText='Ровно 7 - возврат'; bal+=bet; } else if(w){ win=bet*2; msg3.innerText='🎉 '+s+' +'+win; } else msg3.innerText='😢 '+s+' мимо';
    bal+=win; upd(); log('🎲 '+s+' '+(win>0?'+'+win:'-'+bet));
  },400);
}
function resetGame(){ bal=1000; jack=10000; upd(); }
upd();
</script>
</body>
</html>
