<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOCAL AI - В браузере</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial;background:#0a0a0a;color:#fff;height:100vh;display:flex;flex-direction:column}
  header{padding:12px 16px;background:#111;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
  header b{color:#FFD93B}
  #status{font-size:12px;color:#aaa}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:85%;padding:12px 14px;border-radius:14px;line-height:1.5;font-size:15px;white-space:pre-wrap}
  .user{align-self:flex-end;background:#FFD93B;color:#000;border-bottom-right-radius:4px}
  .ai{align-self:flex-start;background:#1e1e1e;border-bottom-left-radius:4px}
  .sys{align-self:center;background:#222;color:#888;font-size:12px;text-align:center}
  #box{display:flex;gap:8px;padding:12px;background:#111;border-top:1px solid #222}
  #inp{flex:1;padding:12px;border-radius:12px;border:1px solid #333;background:#1a1a1a;color:#fff;outline:none;font-size:15px}
  button{padding:12px 18px;border:none;border-radius:12px;background:#FFD93B;font-weight:bold;cursor:pointer}
  #loadBtn{background:#fff;color:#000}
  select{background:#1a1a1a;color:#fff;border:1px solid #333;padding:8px;border-radius:8px}
</style>
</head>
<body>
<header>
  <div><b>🧠 LOCAL AI</b> <span style="font-size:12px;color:#888">100% в браузере | без сервера</span></div>
  <div id="status">Не загружен</div>
</header>
<div id="chat">
  <div class="msg sys">👋 Это локальный ИИ. Модель работает прямо в твоём браузере.<br>Нажми "Загрузить модель" — первый раз качается ~1.5 ГБ, потом работает офлайн.<br>Ничего не уходит на сервер.</div>
</div>
<div style="padding:0 12px 8px;background:#111;display:flex;gap:8px;align-items:center">
  <select id="model">
    <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B - быстрая</option>
    <option value="Llama-3.2-3B-Instruct-q4f16_1-MLC">Llama 3.2 3B - умнее</option>
    <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen 2.5 1.5B - русская</option>
    <option value="Phi-3.5-mini-instruct-q4f16_1-MLC">Phi-3.5 - логика</option>
  </select>
  <button id="loadBtn" onclick="loadAI()">📥 Загрузить модель</button>
  <button onclick="clearChat()">🗑 Очистить</button>
</div>
<div id="box">
  <input id="inp" placeholder="Спроси что угодно..." onkeydown="if(event.key=='Enter') send()">
  <button onclick="send()">➤</button>
</div>

<script type="module">
import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

let engine=null, history=[];
const chatEl=document.getElementById('chat');
const statusEl=document.getElementById('status');

function addMsg(text, cls){
  let d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; chatEl.appendChild(d); chatEl.scrollTop=chatEl.scrollHeight; return d;
}
window.clearChat=()=>{ chatEl.innerHTML=''; history=[]; addMsg('Чат очищен','sys'); }

window.loadAI=async ()=>{
  let model=document.getElementById('model').value;
  statusEl.innerText='⏳ Скачивание... 0%';
  addMsg('Загружаю '+model+'... Это может занять 1-3 минуты первый раз.','sys');
  try{
    engine=await CreateMLCEngine(model, {
      initProgressCallback:(p)=>{ statusEl.innerText='⏳ '+(p.progress*100).toFixed(0)+'% - '+p.text; }
    });
    statusEl.innerText='✅ Готов: '+model;
    addMsg('✅ Модель загружена! Спрашивай что угодно.','sys');
  }catch(e){ statusEl.innerText='❌ Ошибка: '+e.message; addMsg('Ошибка: '+e.message+'\nПопробуй другой браузер (Chrome) и VPN если модель не качается.','sys'); }
}

window.send=async ()=>{
  let inp=document.getElementById('inp'); let txt=inp.value.trim(); if(!txt) return; inp.value='';
  addMsg(txt,'user');
  if(!engine){ addMsg('Сначала нажми "Загрузить модель" ⬆','ai'); return; }
  let aiDiv=addMsg('...','ai');
  history.push({role:'user', content:txt});
  try{
    let chunks=await engine.chat.completions.create({messages:history, stream:true});
    let full='';
    for await (let c of chunks){ let delta=c.choices[0]?.delta?.content||''; full+=delta; aiDiv.textContent=full; chatEl.scrollTop=chatEl.scrollHeight; }
    history.push({role:'assistant', content:full});
  }catch(e){ aiDiv.textContent='Ошибка: '+e.message; }
}
</script>
</body>
</html>
